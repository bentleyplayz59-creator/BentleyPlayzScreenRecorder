name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pip Pillow

      - name: Generate BentleyPlayz app logo
        run: python tools/generate_logo.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare direct APK download
        run: cp app/build/outputs/apk/debug/app-debug.apk BentleyPlayzScreenRecorder.apk

      - name: Publish APK as a direct GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screen-recorder-build-${{ github.run_number }}
          name: BentleyPlayz Screen Recorder build #${{ github.run_number }}
          body: Automated Android APK build from commit ${{ github.sha }}.
          files: BentleyPlayzScreenRecorder.apk
          generate_release_notes: false
          make_latest: true
