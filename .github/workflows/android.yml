name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pip Pillow

      - name: Generate BentleyPlayz app logo
        run: python tools/generate_logo.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile debug variant (validation only)
        run: gradle --no-daemon assembleDebug

      - name: Restore persistent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: RELEASE_${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add the four RELEASE_* signing secrets in repository Settings > Secrets and variables > Actions > Secrets."
            false
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bentleyplayz-release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/bentleyplayz-release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Prepare direct APK download
        run: cp app/build/outputs/apk/release/app-release.apk BentleyPlayzScreenRecorder.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs BentleyPlayzScreenRecorder.apk

      - name: Publish signed APK as a direct GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screen-recorder-build-${{ github.run_number }}
          name: BentleyPlayz Screen Recorder build #${{ github.run_number }}
          body: Signed Android release APK from commit ${{ github.sha }}.
          files: BentleyPlayzScreenRecorder.apk
          generate_release_notes: false
          make_latest: true
